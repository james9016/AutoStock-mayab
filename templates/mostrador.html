<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoStock Mayab - Mostrador</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <span class="text-xl font-bold tracking-tight">⚙️ AutoStock Mayab</span>
            <div class="flex items-center space-x-4">
                {% if usuario %}
                    <span class="text-sm bg-blue-700 px-3 py-1.5 rounded-md font-medium border border-blue-500">
                        👤 {{ usuario.nombre }} ({{ usuario.rol.value if hasattr(usuario.rol, 'value') else usuario.rol }})
                    </span>
                    <a href="/auth/logout" class="text-sm font-semibold bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-md transition shadow">Salir</a>
                {% else %}
                    <div class="flex space-x-2">
                        <a href="#modal-login" class="text-sm font-semibold bg-white text-blue-600 px-3 py-1.5 rounded-md border border-white hover:bg-gray-100 transition shadow-sm">Iniciar Sesión</a>
                        <a href="#modal-registro" class="text-sm font-semibold bg-blue-800 text-white px-3 py-1.5 rounded-md hover:bg-blue-900 transition border border-blue-700 shadow-sm">Registrarse</a>
                    </div>
                {% endif %}
            </div>
        </div>
    </header>
    <main class="max-w-7xl mx-auto p-4 space-y-6">
